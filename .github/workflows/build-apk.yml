name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk snake.apk
      - uses: actions/upload-artifact@v4
        with:
          name: snake-apk
          path: snake.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.$GITHUB_RUN_NUMBER" snake.apk --title "Snake v1.0.$GITHUB_RUN_NUMBER" --notes "Snake game APK"
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f build.log ]; then grep -n -i -E 'error|fail|what went wrong|exception' build.log | head -n 80 > report.txt; echo '-----' >> report.txt; tail -n 120 build.log >> report.txt; else echo 'Build step did not run.' > report.txt; fi
          gh issue create --title "Build failed #$GITHUB_RUN_NUMBER" --body-file report.txt
