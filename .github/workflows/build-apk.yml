name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk snake.apk
      - uses: actions/upload-artifact@v4
        with:
          name: snake-apk
          path: snake.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v1.0.$GITHUB_RUN_NUMBER" snake.apk --title "Snake v1.0.$GITHUB_RUN_NUMBER" --notes "APK: snake.apk"
